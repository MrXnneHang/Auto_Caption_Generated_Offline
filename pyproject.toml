[project]
name = "XnneHangLab"
version = "0.0.5"
description = ""
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "tomli_w>=1.2.0",
    "tomli>=2.2.1",
    "pydantic>=2.10.6",
    "pandas==2.2.3",
    # special for fastapi
    "fastapi[standard]>=0.115.8",
    "uvicorn[standard]>=0.35.0",
    "python-multipart>=0.0.20",
    "websocket-client>=1.8.0",
    "socksio>=1.0.0",
    "loguru>=0.7.3",
    "fastmcp>=2.10.4",
    # "google-genai>=1.25.0",
    "typing-extensions>=4.15.0",
    "python-dotenv>=1.1.1",
    "bs4>=0.0.2",
    "grpcio==1.78.0",
]
authors = [{ name = "MrXnneHang", email = "XnneHang@gmail.com" }]
keywords = []
license = { text = "AGPL-3.0-or-later" }
classifiers = [
  "Operating System :: OS Independent",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Typing :: Typed",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/XnneHangLab/XnneHangLab"
Documentation = "https://github.com/XnneHangLab/XnneHangLab"
Repository = "https://github.com/XnneHangLab/XnneHangLab"
Issues = "https://github.com/XnneHangLab/XnneHangLab/issues"

[project.scripts]
test = "lab.test:main"
get_root = "lab.config_manager.abs_root:main" # 获取项目所在根目录绝对路径
package = "lab.config_manager.package:main"
agent_setting = "lab.config_manager.agent:main"
tmp = "lab.tmp:main" # debug 时随意写的一些脚本

[dependency-groups]
base = [
  "numpy==1.26.4",
  "torch==2.6",
  "torchaudio==2.6",
  "transformers>=4.57",
]

sherpa-onnx = [
  "sherpa-onnx==1.10.46", # 防止 onnxruntime 的版本过高与 genie-tts 冲突
]

qwen-asr = [
  "modelscope>=1.25.0",
  "openvino>=2024.0",
  "qwen-asr",
  "nagisa>=0.2.11",
  "soundfile>=0.13.1",
  "tokenizers>=0.13",
]

dev = [
  "ty>=0.0.1",
  "ruff>=0.9.3",
  "pytest>=8.3.4",
  "pytest-rerunfailures>=15.0",
]

llama-cpp = [
  "llama-cpp-python",
]


# 如果希望使用 tts 均需要加入以下前置
tts_base = [
  "librosa>=0.10.2,<0.12",
  "g2p-en>=2.1.0",
  "cn2an>=0.5.23",
  "pypinyin>=0.54.0",
]

gsv-lite = [
  "gsv-tts-lite",
  "av", # required by gsv-tts-lite 0.4.x for FFmpeg-free audio loading
]

ocr = [
  "rapidocr-onnxruntime>=1.4.0",
]

# 记忆管线（wikimem 插件后端）：zh = jieba 分词，embed = 可选语义融合
wikimem = [
  "wikimem[zh,embed]",
]

genie-tts = [
  "onnx",
  "onnxruntime==1.22.1", # 升级 1.23 往后有 40% 点速度性能损耗。
  "pyyaml",
  "huggingface_hub[hf_xet]",
  "pyopenjtalk-plus",
  "nltk",
  "g2pM",
  "jamo",
  "ko_pron",
  "g2pk2",
  "eunjeon; sys_platform == 'win32'",
  "fast_langdetect",
  "jieba_fast",
]

vtuber = [
  "socksio>=1.0.0",
  "chardet>=5.2.0",
  "pydub>=0.25.1",
  "langdetect>=1.0.9",
  "pysbd>=0.3.4",
  "aiohttp>=3.12.13",
  "openai>=1.93.0",
  "soundfile>=0.13.1",
]

qwen-tts = [
  "faster-qwen3-tts>=0.2.5",
  "soxr>=1.0.0",
  "sounddevice>=0.5.2",
]

[tool.uv]
default-groups = ["base", "ocr", "dev", "llama-cpp", "vtuber", "wikimem"]

[tool.uv.workspace]
members = ["packages/Qwen3-ASR", "packages/GSV-TTS-Lite", "packages/wikimem"]
# memU (memu-cli) requires Python 3.13 + a maturin/Rust core; this workspace is
# pinned to 3.11. The `memu` plugin invokes its CLI out-of-process via
# `uv run --no-project --with packages/memU`, so keep it out of the 3.11 resolution
# entirely (ADR-0003).
exclude = ["packages/memU"]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform == 'win32'" }, # sys_platform : 'win32' , 'linux' , 'Darwin'
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'"}
]
torchaudio = [
  { index = "pytorch-cu118", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'win32'"}
]
langsegment = { path = "./dist/LangSegment-0.3.5-py3-none-any.whl"}
llama-cpp-python = [
  { path = "./dist/llama_cpp_python-0.3.18-cp311-cp311-win_amd64.whl", marker = "sys_platform == 'win32'" },
  { index = "llama-cpp-cpu", marker = "sys_platform != 'win32'" },
]
qwen-asr = {  workspace = true }
gsv-tts-lite = { workspace = true }
wikimem = { workspace = true }

[tool.ty.environment]
python-version = "3.11"
# Pin the platform CI checks (ubuntu) so `just lint` reports identical
# diagnostics on Windows dev machines and in CI. win32-only branches
# (guarded by `sys.platform == "win32"`) are skipped as unreachable.
python-platform = "linux"
# gsv-tts-lite uses a setuptools import-hook editable install ty cannot
# follow, so its flat-layout sources are added as an explicit root.
root = ["src", "packages/wikimem/src", "packages/GSV-TTS-Lite"]

[tool.ty.src]
include = ["src/lab", "tests", "scripts"]

# Tests intentionally build pydantic Settings models with no args (defaults come
# from Annotated Field metadata ty cannot see) and inject fakes / monkeypatches.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
missing-argument = "ignore"
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
invalid-assignment = "ignore"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  # Pyflakes
  "F",
  # Pycodestyle
  "E",
  "W",
  # Isort
  "I",
  # Comprehensions
  "C4",
  # Debugger
  "T100",
  # Pyupgrade
  "UP",
  # Flake8-pyi
  "PYI",
  # Bugbear
  "B",
  # Pylint
  "PLE",
  # Flake8-simplify
  "SIM101",
  # Flake8-use-pathlib
  "PTH",
  # Pygrep-hooks
  "PGH004",
  # Flake8-type-checking
  "TC",
  # Flake8-raise
  "RSE",
  # Refurb
  "FURB",
  # Flake8-future-annotations
  "FA",
  # Yesqa
  "RUF100",
]
ignore = [
  "E501", # line too long, duplicate with ruff fmt
  "F401", # imported but unused, duplicate with pyright
  "F841", # local variable is assigned to but never used, duplicate with pyright
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
known-first-party = ["lab"]
combine-as-imports = true

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]


[tool.hatch.build.targets.wheel]

packages = ["src/lab"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


