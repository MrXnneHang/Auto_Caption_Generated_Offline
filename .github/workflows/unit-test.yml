name: Unit Test
on:
  push:
    branches: [dev]
  pull_request:
  merge_group:
  workflow_dispatch:
jobs:
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
        architecture: ["x64"]
    name: Python ${{ matrix.python-version }} on ${{ matrix.architecture }} unit test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
      - name: Install just
        uses: extractions/setup-just@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - name: pull submodules
        run: |
          git submodule update --init --recursive
      - name: Install dependencies
        run: |
          just ci-install

      - name: Run lightweight runtime tests
        run: |
          just test-light

      - name: Run voice capability contract tests
        run: |
          just test-voice-contract

      - name: Run remaining unit tests
        run: |
          just ci-test
